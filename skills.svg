<svg xmlns="http://www.w3.org/2000/svg" width="720" height="185" viewBox="0 0 720 185" role="img" aria-label="Terminal printing skills via cat skills.txt">
  <title>rares@kali — cat skills.txt</title>
  <defs>
    <style>
      .win{fill:#0b0e14}.bar{fill:#141925}
      .title{fill:#6b7389;font:13px 'JetBrains Mono','Fira Code',Consolas,Monaco,monospace}
      .mono{font:15px 'JetBrains Mono','Fira Code',Consolas,Monaco,monospace}
      .p{fill:#2ee66b}.c{fill:#c8d3f5}.lbl{fill:#e0af68}.val{fill:#9ece6a}
      /* each line wipes in once, then holds (fill-mode forwards, no loop) */
      @keyframes type{from{width:0}to{width:400px}}
      #k1 rect{animation:type .5s linear .2s forwards}
      #k2 rect{animation:type .5s linear .9s forwards}
      #k3 rect{animation:type .5s linear 1.6s forwards}
      #k4 rect{animation:type .5s linear 2.3s forwards}
      /* resting cursor: appears after last line, then blinks forever */
      .curEnd{visibility:hidden;fill:#2ee66b}
      #curEnd{animation:show 3.1s steps(1,end) forwards,blink 1s steps(1,end) 3.0s infinite}
      @keyframes show{0%,96%{visibility:hidden}100%{visibility:visible}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){
        #k1 rect,#k2 rect,#k3 rect,#k4 rect{animation:none;width:400px}
        #curEnd{animation:none;visibility:visible}
      }
    </style>
    <clipPath id="k1"><rect x="24" y="66" height="22" width="0"/></clipPath>
    <clipPath id="k2"><rect x="24" y="92" height="22" width="0"/></clipPath>
    <clipPath id="k3"><rect x="24" y="118" height="22" width="0"/></clipPath>
    <clipPath id="k4"><rect x="24" y="144" height="22" width="0"/></clipPath>
  </defs>
