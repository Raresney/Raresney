<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-label="Animated terminal running a recon session">
  <title>rares@kali — recon session</title>
  <defs>
    <style>
      .win   { fill:#0b0e14; }
      .bar   { fill:#141925; }
      .title { fill:#6b7389; font:13px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Monaco,monospace; }
      .mono  { font:15px 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Monaco,monospace; }
      .p  { fill:#2ee66b; }           /* prompt */
      .c  { fill:#c8d3f5; }           /* command */
      .cy { fill:#7dcfff; }           /* whoami output */
      .ok { fill:#7bd88f; }           /* scan rows */
      .pu { fill:#bb9af7; }           /* skills */
      .win2 { fill:#9ece6a; font-weight:bold; }
      .cur  { fill:#2ee66b; }

      /* single travelling cursor: visible only between a finished line and the next one starting */
      .cur { visibility:hidden; animation:blink .9s steps(1,end) infinite; }
      #cur1 { animation:blink .9s steps(1,end) infinite, g1 16s steps(1,end) infinite; }
      #cur2 { animation:blink .9s steps(1,end) infinite, g2 16s steps(1,end) infinite; }
      #cur4 { animation:blink .9s steps(1,end) infinite, g4 16s steps(1,end) infinite; }
      #cur5 { animation:blink .9s steps(1,end) infinite, g5 16s steps(1,end) infinite; }
      #cur6 { animation:blink .9s steps(1,end) infinite, g6 16s steps(1,end) infinite; }
      #cur7 { animation:blink .9s steps(1,end) infinite, g7 16s steps(1,end) infinite; }
      #cur9 { animation:blink .9s steps(1,end) infinite, g9 16s steps(1,end) infinite; }
      #cur10{ animation:blink .9s steps(1,end) infinite, g10 16s steps(1,end) infinite; }
      #cur12{ animation:blink .9s steps(1,end) infinite, g12 16s steps(1,end) infinite; }
      #cur13{ animation:blink .9s steps(1,end) infinite, g13 16s steps(1,end) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes g1 {0%{visibility:hidden}8.1%{visibility:visible}9.4%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g2 {0%{visibility:hidden}14.4%{visibility:visible}16.25%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g4 {0%{visibility:hidden}23.75%{visibility:visible}25%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g5 {0%{visibility:hidden}28.1%{visibility:visible}28.75%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g6 {0%{visibility:hidden}31.9%{visibility:visible}32.5%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g7 {0%{visibility:hidden}35.6%{visibility:visible}37.5%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g9 {0%{visibility:hidden}43.1%{visibility:visible}44.4%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g10{0%{visibility:hidden}50.6%{visibility:visible}52.5%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g12{0%{visibility:hidden}58.75%{visibility:visible}60%{visibility:hidden}100%{visibility:hidden}}
      @keyframes g13{0%{visibility:hidden}63.75%{visibility:visible}94%{visibility:hidden}100%{visibility:hidden}}

      /* typewriter reveal: clip-rect width grows across each line's time slot, then snaps clear at 94% and loops */
      #k1 rect  { animation:t1 16s linear infinite; }
      #k2 rect  { animation:t2 16s linear infinite; }
      #k4 rect  { animation:t4 16s linear infinite; }
      #k5 rect  { animation:t5 16s linear infinite; }
      #k6 rect  { animation:t6 16s linear infinite; }
      #k7 rect  { animation:t7 16s linear infinite; }
      #k9 rect  { animation:t9 16s linear infinite; }
      #k10 rect { animation:t10 16s linear infinite; }
      #k12 rect { animation:t12 16s linear infinite; }
      #k13 rect { animation:t13 16s linear infinite; }
      @keyframes t1 {0%,1.9%{width:0}8.1%{width:186px}94%{width:186px}94.001%{width:0}100%{width:0}}
      @keyframes t2 {0%,9.4%{width:0}14.4%{width:438px}94%{width:438px}94.001%{width:0}100%{width:0}}
      @keyframes t4 {0%,16.25%{width:0}23.75%{width:357px}94%{width:357px}94.001%{width:0}100%{width:0}}
      @keyframes t5 {0%,25%{width:0}28.1%{width:321px}94%{width:321px}94.001%{width:0}100%{width:0}}
      @keyframes t6 {0%,28.75%{width:0}31.9%{width:312px}94%{width:312px}94.001%{width:0}100%{width:0}}
      @keyframes t7 {0%,32.5%{width:0}35.6%{width:312px}94%{width:312px}94.001%{width:0}100%{width:0}}
      @keyframes t9 {0%,37.5%{width:0}43.1%{width:258px}94%{width:258px}94.001%{width:0}100%{width:0}}
      @keyframes t10{0%,44.4%{width:0}50.6%{width:537px}94%{width:537px}94.001%{width:0}100%{width:0}}
      @keyframes t12{0%,52.5%{width:0}58.75%{width:312px}94%{width:312px}94.001%{width:0}100%{width:0}}
      @keyframes t13{0%,60%{width:0}63.75%{width:195px}94%{width:195px}94.001%{width:0}100%{width:0}}

      @media (prefers-reduced-motion: reduce){
        #k1 rect,#k2 rect,#k4 rect,#k5 rect,#k6 rect,#k7 rect,#k9 rect,#k10 rect,#k12 rect,#k13 rect{animation:none;width:560px}
        .cur{animation:none;visibility:hidden}
      }
    </style>
    <clipPath id="k1"><rect x="24" y="66" height="22" width="0"/></clipPath>
    <clipPath id="k2"><rect x="24" y="92" height="22" width="0"/></clipPath>
    <clipPath id="k4"><rect x="24" y="144" height="22" width="0"/></clipPath>
    <clipPath id="k5"><rect x="24" y="170" height="22" width="0"/></clipPath>
    <clipPath id="k6"><rect x="24" y="196" height="22" width="0"/></clipPath>
    <clipPath id="k7"><rect x="24" y="222" height="22" width="0"/></clipPath>
    <clipPath id="k9"><rect x="24" y="274" height="22" width="0"/></clipPath>
    <clipPath id="k10"><rect x="24" y="300" height="22" width="0"/></clipPath>
    <clipPath id="k12"><rect x="24" y="352" height="22" width="0"/></clipPath>
    <clipPath id="k13"><rect x="24" y="378" height="22" width="0"/></clipPath>
  </defs>

  <!-- window -->
  <rect class="win" x="8" y="8" width="804" height="414" rx="12"/>
  <rect class="bar" x="8" y="8" width="804" height="40" rx="12"/>
  <rect class="bar" x="8" y="36" width="804" height="12"/>
  <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="28" r="6" fill="#27c93f"/>
  <text class="title" x="410" y="32" text-anchor="middle">rares@kali: ~ — zsh</text>

  <!-- body -->
  <g class="mono">
    <g clip-path="url(#k1)"><text x="24" y="80"><tspan class="p">rares@kali:~$ </tspan><tspan class="c">whoami</tspan></text></g>
    <g clip-path="url(#k2)"><text x="24" y="106" class="cy">cybersecurity enthusiast — offensive + defensive</text></g>

    <g clip-path="url(#k4)"><text x="24" y="158"><tspan class="p">rares@kali:~$ </tspan><tspan class="c">nmap -sV -T4 target.local</tspan></text></g>
    <g clip-path="url(#k5)"><text x="24" y="184" class="ok">22/tcp   open   ssh     OpenSSH 9.6</text></g>
    <g clip-path="url(#k6)"><text x="24" y="210" class="ok">80/tcp   open   http    nginx 1.25</text></g>
    <g clip-path="url(#k7)"><text x="24" y="236" class="ok">443/tcp  open   https   nginx 1.25</text></g>

    <g clip-path="url(#k9)"><text x="24" y="288"><tspan class="p">rares@kali:~$ </tspan><tspan class="c">cat skills.txt</tspan></text></g>
    <g clip-path="url(#k10)"><text x="24" y="314" class="pu">Python · Rust · TypeScript · Bash · Wireshark · Burp · Nmap</text></g>

    <g clip-path="url(#k12)"><text x="24" y="366"><tspan class="p">rares@kali:~$ </tspan><tspan class="c">./access --portfolio</tspan></text></g>
    <g clip-path="url(#k13)"><text x="24" y="392" class="win2">[+] granted. welcome.</text></g>
  </g>

  <!-- single travelling cursor -->
  <rect id="cur1"  class="cur" x="204" y="66"  width="9" height="17"/>
  <rect id="cur2"  class="cur" x="456" y="92"  width="9" height="17"/>
  <rect id="cur4"  class="cur" x="375" y="144" width="9" height="17"/>
  <rect id="cur5"  class="cur" x="339" y="170" width="9" height="17"/>
  <rect id="cur6"  class="cur" x="330" y="196" width="9" height="17"/>
  <rect id="cur7"  class="cur" x="330" y="222" width="9" height="17"/>
  <rect id="cur9"  class="cur" x="276" y="274" width="9" height="17"/>
  <rect id="cur10" class="cur" x="555" y="300" width="9" height="17"/>
  <rect id="cur12" class="cur" x="330" y="352" width="9" height="17"/>
  <rect id="cur13" class="cur" x="213" y="378" width="9" height="17"/>
</svg>
